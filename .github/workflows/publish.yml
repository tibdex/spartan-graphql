name: Publish

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --wheel
      - uses: actions/upload-artifact@v7.0.2
        with:
          if-no-files-found: error
          name: wheel
          path: dist/*.whl

  publish:
    needs: build
    # The file name and this environment are registered as this project's trusted publisher on PyPI.
    environment: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Attestations and trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: wheel
          path: dist/

      - uses: astral-sh/setup-uv@v10.3.3

      # Creates the attestations PyPI shows as the release's provenance.
      - uses: astral-sh/attest-action@v0.0.7
      - run: uv publish
